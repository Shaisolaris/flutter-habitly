name: flutter_habitly
description: >-
  Habitly - a positive-reinforcement habit tracker with streaks, a 4-week
  consistency heatmap, and gentle daily reminders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management. HabitRepository is injected through a Riverpod
  # Provider so the UI layer never talks to shared_preferences directly.
  flutter_riverpod: ^2.6.1

  # Local persistence for habits, check-ins, and settings (stored as JSON).
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
